[package]
name = "klikvibe"
version = "0.1.0"
description = "Free, open-source, lightweight code editor for vibe coding"
authors = ["Adam Suchi Hafizullah"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ashafizullah/klikvibe"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue).
name = "klikvibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
# Listing folders the way Git sees them (.gitignore, .git/info/exclude).
ignore = "0.4"
# Telling the window when files change on disk (an agent at work).
notify = "8"
notify-debouncer-mini = "0.7"

# Debug builds keep line numbers for backtraces but not full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
