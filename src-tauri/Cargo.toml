[package]
name = "klikvibe"
version = "0.6.0"
description = "Free, open-source, lightweight code editor for vibe coding"
authors = ["Adam Suchi Hafizullah"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ashafizullah/klikvibe"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue).
name = "klikvibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
# Listing folders the way Git sees them (.gitignore, .git/info/exclude).
ignore = "0.4"
# Finding where a name is defined (go to definition), without a language server.
regex = "1"
# Telling the window when files change on disk (an agent at work).
notify = "8"
notify-debouncer-mini = "0.7"
# Decoding file paths in media:// URLs.
percent-encoding = "2"
# The local MCP server for the user's agent (see mcp.rs).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures = "0.3"
tauri-plugin-updater = "2"
# Fetching the changelog of a new version (also the MCP server's tests).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Reading the clipboard for Paste in the editor menu (text only, no image support).
arboard = { version = "3", default-features = false }
# System notifications when an agent in a terminal waits for the user.
tauri-plugin-notification = "2"
# KlikVibe Remote (see src/remote/PROTOCOL.md): the end-to-end encrypted channel
# to the phone, the pairing QR code, the computer's LAN addresses and name, its
# mDNS announcement, and the outbound connection to the relay.
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.15"
hostname = "0.4"
getrandom = "0.3"
mdns-sd = "0.21"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Debug builds keep line numbers for backtraces but not full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# No `panic = "abort"`: AppKit (and WebKit) raise Objective-C exceptions that
# unwind through tao's event handler, and with abort that ends the app
# (SIGABRT) where AppKit would log the exception and carry on. A panic in a
# command then also fails only that command.
strip = true
